services:
  database:
    image: 'postgres:17'
    ports:
      - '4200:5432'
    environment:
      - POSTGRES_USER=auroria
      - POSTGRES_PASSWORD=auroria
      - POSTGRES_DB=auroria-toolkit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U auroria -d auroria-toolkit
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
    external: false
